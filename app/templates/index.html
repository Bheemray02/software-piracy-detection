<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Piracy Detection</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    h1 { margin-bottom: .25rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    textarea { width: 100%; height: 220px; font-family: ui-monospace, monospace; font-size: 13px; }
    button { padding: .6rem 1.2rem; margin-top: .75rem; cursor: pointer; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
    section { margin-bottom: 2.5rem; }
  </style>
</head>
<body>
  <h1>Software Piracy Detection</h1>
  <p>Compare two code snippets for structural similarity and predict a license from its text.</p>

  <section>
    <h2>1. Compare source code</h2>
    <div class="grid">
      <textarea id="a" placeholder="Original code"></textarea>
      <textarea id="b" placeholder="Suspected copy"></textarea>
    </div>
    <button onclick="compare()">Compare</button>
    <pre id="compare-out">Result will appear here.</pre>
  </section>

  <section>
    <h2>2. Predict license</h2>
    <textarea id="lic" placeholder="Paste a license header or LICENSE text"></textarea>
    <button onclick="predict()">Predict license</button>
    <pre id="license-out">Result will appear here.</pre>
  </section>

<script>
async function post(url, body, outId) {
  const out = document.getElementById(outId);
  const res = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  out.textContent = JSON.stringify(await res.json(), null, 2);
}
const compare = () => post("/api/compare", {code_a: a.value, code_b: b.value}, "compare-out");
const predict = () => post("/api/license", {text: lic.value}, "license-out");
</script>
</body>
</html>
